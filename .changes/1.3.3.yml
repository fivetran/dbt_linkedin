version: 1.3.3
under_the_hood:
- description: Replaces the `linkedin_ads_extract_url_parameter` macro with `dbt_utils.get_url_parameter` and
    removes `linkedin_ads_extract_url_parameter`. `dbt_utils.get_url_parameter` now includes the
    same Spark and Databricks logic, so output doesn't change.
- description: Replaces `fivetran_utils.enabled_vars` in model configs with `and` and an explicit `true`
    default for each variable, so each model's default shows where it's used. Unset variables still
    default to `true`.
